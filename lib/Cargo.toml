[workspace]
resolver = "3"
members = ["crates/core", "crates/chunk", "crates/embed", "crates/index", "crates/judge", "crates/net", "crates/py", "crates/query", "crates/read"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ragworks-core = { path = "crates/core" }
ragworks-net = { path = "crates/net" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = "1.2.2"
thiserror = "2.0.20"
rayon = "1.12.0"
unicode-segmentation = "1.13.3"
ureq = { version = "3.4.2", features = ["json"] }
csv = "1.4.0"
encoding_rs = "0.8.41"
html2text = "0.17.1"
walkdir = "2.5.0"
pdf-extract = "0.12.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Keep line tables. Without them, the macOS/arm64 linker on this toolchain
# emits a cdylib that dyld rejects at import with "mis-aligned LINKEDIT string
# pool". Verified by bisection: debug builds load, every release build without
# debug info fails, and -ld_classic does not help. Costs binary size and buys
# correct panics; strip at packaging time if a release wheel needs to be small.
debug = 1
