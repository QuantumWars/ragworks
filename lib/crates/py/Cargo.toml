[package]
name = "ragworks-py"
description = "Python bindings for ragworks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ragworks"
crate-type = ["cdylib", "rlib"]

[dependencies]
ragworks-core.workspace = true
ragworks-chunk = { path = "../chunk" }
ragworks-embed = { path = "../embed" }
ragworks-index = { path = "../index" }
ragworks-judge = { path = "../judge" }
ragworks-query = { path = "../query" }
# PDF is on for the Python wheel: it is pure Rust, so it costs binary size but
# no system dependency, and a Python RAG user expects PDFs to work.
ragworks-read = { path = "../read", features = ["pdf"] }
serde_json.workspace = true
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]
